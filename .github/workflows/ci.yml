name: CI

# Deploy jest ręczny przez Visual Studio Publish — patrz docs/. Ten workflow tylko buduje
# i puszcza testy non-Docker / non-Live żeby PR-y były weryfikowane.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        dotnet-quality: preview

    - name: Restore
      run: dotnet restore SportRentalHybrid.sln

    - name: Build
      run: dotnet build SportRentalHybrid.sln --no-restore --configuration Release

    - name: Test (excl. RequiresLiveDb / RequiresLiveServices / RequiresWebFactory / RequiresDocker)
      run: |
        dotnet test SportRentalHybrid.sln \
          --no-build --configuration Release \
          --filter "Category!=RequiresLiveDb&Category!=RequiresLiveServices&Category!=RequiresWebFactory&Category!=RequiresDocker" \
          --logger "trx;LogFileName=tests.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'
