<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // A responsive variant can be unavailable even when the URL stored by the API still works.
        // Try that known source once, then finish with a neutral local placeholder.
        window.srImg = function (img) {
            var fallback = img.dataset.fallbackSrc;
            var fallbackAlreadyTried = img.dataset.fallbackAttempted === "true";

            if (!fallbackAlreadyTried && fallback) {
                img.dataset.fallbackAttempted = "true";
                img.removeAttribute("srcset");
                img.removeAttribute("sizes");

                var currentUrl = img.currentSrc || img.src;
                var fallbackUrl = fallback;
                try {
                    currentUrl = new URL(currentUrl, document.baseURI).href;
                    fallbackUrl = new URL(fallback, document.baseURI).href;
                } catch (_) {
                    // Let the browser resolve a non-standard but usable relative URL below.
                }
                if (currentUrl !== fallbackUrl) {
                    img.src = fallback;
                    return;
                }
            }

            img.onerror = null;
            img.removeAttribute("srcset");
            img.removeAttribute("sizes");
            img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect width='400' height='300' fill='%23EBEEF5'/%3E%3Cg fill='none' stroke='%239AA4B8' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='148' y='112' width='104' height='80' rx='8'/%3E%3Ccircle cx='176' cy='140' r='9'/%3E%3Cpath d='M156 188l34-32 22 22 18-18 22 22'/%3E%3C/g%3E%3C/svg%3E";
            img.style.objectFit = "cover";
        };
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/leaflet-map.js"></script>
    <script src="js/mobile-detection.js"></script>
    <script src="js/home-layout.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
